# Pipeline check only: two tiny models, a few dozen gradient steps. Not a result.
defaults:
  - official
  - _self_

name: smoke
device: cpu

epochs: 1
num_training_samples: 2
num_training_time_steps: 20
num_dataloader_workers: 0
num_test_samples: 2
