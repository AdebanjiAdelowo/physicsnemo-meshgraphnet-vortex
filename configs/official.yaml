# Adapted from examples/cfd/vortex_shedding_mgn/conf/config.yaml of NVIDIA PhysicsNeMo,
# commit b45a5c810c741e6b41f8515be24c51121f8fc21f. Modified by Adebanji Adelowo (2026):
# the keys above the marker are the upstream keys with the upstream values, except that
# the hydra block was removed (configs are composed, not run through hydra.main) and
# data_dir points at this repository's data directory. The keys below the marker were
# added for this repository.

# data configs
data_dir: data/cylinder_flow

# training configs
batch_size: 1
epochs: 25
num_training_samples: 400
num_training_time_steps: 300
lr: 0.0001
lr_decay_rate: 0.9999991
num_input_features: 6
num_output_features: 3
num_edge_features: 3

# performance configs
amp: False
jit: False
num_dataloader_workers: 4
do_concat_trick: False
num_processor_checkpoint_segments: 0
recompute_activation: False

# wandb configs
wandb_mode: disabled
watch_model: False

ckpt_path: "./checkpoints"

# test & visualization configs
num_test_samples: 10
num_test_time_steps: 300
viz_vars: ["u", "v", "p"]
frame_skip: 10
frame_interval: 1

# ---------------------------------------------------------------------------
# Added in this repository
# ---------------------------------------------------------------------------

name: official
output_dir: runs/${name}
device: auto              # auto: cuda if available, else mps, else cpu

# Number of message-passing blocks of the processor. Upstream does not set it and
# uses the MeshGraphNet default, 15. The study varies this one argument.
processor_size: 15

log_every: 1000           # gradient steps per row of history.csv

validation:
  num_samples: 10         # trajectories of valid.tfrecord, without noise
  stride: 10              # every stride-th (trajectory, time) pair is evaluated
  per_epoch: 1            # evaluations per epoch, equally spaced

rollout:
  horizons: [1, 10, 50, 100, 200, 299]   # steps at which rollout errors are tabulated
  max_lag: 40             # largest time shift, in steps, of the lag-minimised error
  one_step_stride: 5      # one-step errors are evaluated at every stride-th step
  field_times: [50, 150, 299]            # steps stored for the field figures

study:
  processor_sizes: [15]
  seeds: [0]
