[project]
name = "physicsnemo-meshgraphnet-vortex"
version = "0.1.0"
description = "Message-passing depth study of the NVIDIA PhysicsNeMo MeshGraphNet vortex-shedding example"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "Adebanji Adelowo" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
